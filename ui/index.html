<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; }
  body { background: #101418; color: #e8ecf1; height: 100vh; overflow-y: auto; }
  header { padding: 42px 18px 10px; background: linear-gradient(180deg, #16202b, #101418); position: sticky; top: 0; }
  header h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
  header p { font-size: 11px; color: #7d8pa0; color: #7d8a9a; margin-top: 2px; }
  .station { margin: 10px 12px; background: #161c24; border-radius: 14px; overflow: hidden; }
  .station-head { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 14px 6px; }
  .station-head .name { font-size: 15px; font-weight: 650; }
  .station-head .dist { font-size: 11px; color: #7d8a9a; }
  .metro-tag { font-size: 9px; background: #1d3d5c; color: #7fc0ff; border-radius: 4px; padding: 1px 5px; margin-left: 6px; vertical-align: middle; }
  .row { display: flex; align-items: center; padding: 7px 14px; border-top: 1px solid #1d2530; }
  .dot { width: 9px; height: 9px; border-radius: 50%; margin-right: 9px; flex: none; }
  .train { font-size: 13px; flex: 1; }
  .status { font-size: 10px; color: #7d8a9a; margin-right: 10px; text-transform: uppercase; letter-spacing: 0.4px; }
  .status.boarding { color: #3ad06a; }
  .status.delayed { color: #f08a3c; }
  .eta { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; }
  .empty { padding: 10px 14px; font-size: 12px; color: #55606d; border-top: 1px solid #1d2530; }
  footer { text-align: center; font-size: 10px; color: #4a5560; padding: 14px 0 24px; }
</style>
</head>
<body>
<header><h1>Transit</h1><p>Del Perro Sands · live arrivals</p></header>
<div id="list"></div>
<footer>DPS Transit Authority</footer>
<script>
function fmtEta(s) {
  if (s < 45) return 'Due';
  const m = Math.round(s / 60);
  return m + ' min';
}
async function refresh() {
  try {
    const res = await fetch(`https://${GetParentResourceName ? GetParentResourceName() : 'dps-transitapp'}/getBoard`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}'
    });
    const board = await res.json();
    const el = document.getElementById('list');
    el.innerHTML = '';
    for (const st of board) {
      const div = document.createElement('div');
      div.className = 'station';
      const metroTag = st.track === 3 ? '<span class="metro-tag">METRO</span>' : '';
      let rows = '';
      const arr = (st.arrivals || []).slice(0, 3);
      if (!arr.length) rows = '<div class="empty">No service</div>';
      for (const a of arr) {
        rows += `<div class="row"><span class="dot" style="background:${a.color}"></span>` +
          `<span class="train">${a.train}</span>` +
          `<span class="status ${a.status.replace(' ', '')}">${a.status}</span>` +
          `<span class="eta">${fmtEta(a.eta)}</span></div>`;
      }
      div.innerHTML = `<div class="station-head"><span class="name">${st.station}${metroTag}</span>` +
        `<span class="dist">${st.dist < 1500 ? st.dist + 'm' : (st.dist / 1000).toFixed(1) + 'km'}</span></div>` + rows;
      el.appendChild(div);
    }
  } catch (e) {}
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
